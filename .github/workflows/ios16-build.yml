name: iOS16 Build

on:
  push:
    branches: [ios16]
  workflow_dispatch:

jobs:
  ipa:
    name: iOS16 无签名 IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 选择最新 Xcode
        run: |
          CANDIDATE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用 $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - name: 编译真机包（iOS16 目标，未签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project WB2API.xcodeproj \
            -scheme WB2API \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            | tee /tmp/build.log | tail -60

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP=$(find .build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          # INFOPLIST_KEY_ 只支持白名单键，自定义键会被静默丢弃，所以这里直接注入
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          echo "--- 120Hz 开关（必须是 true）---"
          /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$APP/Info.plist" || echo "❌ 缺 CADisableMinimumFrameDurationOnPhone"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          rm -rf /tmp/ipa/Payload/*.app/_CodeSignature || true
          cd /tmp/ipa && zip -qry WB2API-unsigned.ipa Payload
          ls -lh WB2API-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WB2API-ios16-ipa
          path: /tmp/ipa/WB2API-unsigned.ipa
          retention-days: 14

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios16-build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
